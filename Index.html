<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExCompute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --white:#f5f5f2;
    --grey:#8a8a86;
    --dim:#333331;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--black);
    color:var(--white);
    font-family:'Space Grotesk', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem;
  }

  .content{
    max-width:600px;
  }

  h1{
    font-weight:500;
    font-size:clamp(2rem, 6vw, 3.2rem);
    letter-spacing:-0.01em;
    margin-bottom:1.1rem;
  }

  .expand{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--grey);
    margin-bottom:0.9rem;
  }

  p.tagline{
    font-weight:300;
    font-size:clamp(1.1rem, 2.4vw, 1.4rem);
    color:#d4d4d1;
    margin-bottom:0.6rem;
  }

  .coming{
    font-family:'JetBrains Mono', monospace;
    font-size:0.75rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--grey);
    margin-bottom:2.8rem;
  }

  form{
    display:flex;
    gap:0;
    border-bottom:1px solid var(--white);
    padding-bottom:0.6rem;
    max-width:380px;
    margin:0 auto;
  }
  input[type="email"]{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--white);
    font-family:'JetBrains Mono', monospace;
    font-size:0.9rem;
    padding:0.3rem 0;
    text-align:left;
  }
  input[type="email"]::placeholder{
    color:var(--dim);
  }
  button{
    background:transparent;
    border:none;
    color:var(--white);
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
    padding:0.3rem 0 0.3rem 1rem;
    white-space:nowrap;
    transition:opacity 0.2s ease;
  }
  button:hover{opacity:0.6;}
  button:focus-visible, input:focus-visible{
    outline:1px solid var(--white);
    outline-offset:4px;
  }

  .note{
    margin-top:0.8rem;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    color:var(--dim);
    min-height:1em;
  }
  .note.active{color:var(--grey);}

  @media (max-width:480px){
    form{max-width:100%;}
  }
</style>
</head>
<body>

<div class="content">
  <h1>ExCompute</h1>
  <div class="expand">Exponential Compute</div>
  <p class="tagline">Limitless. Diversified. Decentralised.</p>
  <div class="coming">Coming 2027</div>

  <form id="signupForm" action="https://formspree.io/f/xkjwqwan" method="POST">
    <input type="email" id="emailInput" name="email" placeholder="Enter email for more info" required autocomplete="email">
    <button type="submit">Notify me →</button>
  </form>
  <div class="note" id="formNote"></div>
</div>

<script>
  const form = document.getElementById('signupForm');
  const note = document.getElementById('formNote');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim();
    if(!email) return;
    note.textContent = "Sending…";
    note.classList.add('active');
    try{
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if(response.ok){
        note.textContent = "Thanks — we'll be in touch.";
        form.reset();
      } else {
        note.textContent = "Something went wrong — please try again.";
      }
    } catch(err){
      note.textContent = "Something went wrong — please try again.";
    }
  });
</script>

</body>
</html>
